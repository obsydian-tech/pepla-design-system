<section data-example="Roles">
  <div style="display:flex;flex-wrap:wrap;gap:var(--space-300);align-items:center">
    <span style="display:inline-flex;gap:var(--space-075);align-items:center"><i data-lucide="sparkles" class="pp-icon pp-icon--agent"></i>Checked by Pepla</span>
    <span style="display:inline-flex;gap:var(--space-075);align-items:center"><i data-lucide="circle-check" class="pp-icon pp-icon--success"></i>Verified</span>
    <span style="display:inline-flex;gap:var(--space-075);align-items:center"><i data-lucide="clock" class="pp-icon pp-icon--warning"></i>Due in 2 days</span>
    <span style="display:inline-flex;gap:var(--space-075);align-items:center"><i data-lucide="octagon-alert" class="pp-icon pp-icon--danger"></i>ID check failed</span>
    <span style="display:inline-flex;gap:var(--space-075);align-items:center"><i data-lucide="eye-off" class="pp-icon pp-icon--subtle"></i>Hidden</span>
  </div>
</section>
<section data-example="Module tiles">
  <div style="display:flex;flex-wrap:wrap;gap:var(--space-200)">
    <span class="pp-icon-tile pp-icon-tile--brand"><i data-lucide="user-plus" class="pp-icon"></i></span>
    <span class="pp-icon-tile pp-icon-tile--brand"><i data-lucide="rocket" class="pp-icon"></i></span>
    <span class="pp-icon-tile"><i data-lucide="calendar-days" class="pp-icon"></i></span>
    <span class="pp-icon-tile"><i data-lucide="life-buoy" class="pp-icon"></i></span>
    <span class="pp-icon-tile pp-icon-tile--agent"><i data-lucide="sparkles" class="pp-icon"></i></span>
  </div>
</section>
