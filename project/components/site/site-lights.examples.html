<section data-example="Three lights behind a headline">
  <div class="pp-site-stage" data-theme="light">
    <div class="pp-site-section pp-site-section--clip">
      <div class="pp-site-lights" aria-hidden="true">
        <span class="pp-site-light pp-site-light--violet" style="--_x: 70%; --_y: 30%; --_i: 0"></span>
        <span class="pp-site-light pp-site-light--mint" style="--_x: 88%; --_y: 85%; --_size: 34cqw; --_i: 1"></span>
        <span class="pp-site-light pp-site-light--coral" style="--_x: 15%; --_y: 85%; --_size: 36cqw; --_i: 2"></span>
      </div>
      <div class="pp-site-wrap"><p class="pp-site-eyebrow">People, risk and compliance platform</p><h2 class="pp-site-section__title">Lights drift behind the words.</h2></div>
    </div>
  </div>
</section>
