<section data-example="Removable skills on a candidate">
  <div class="pp-field">
    <span class="pp-field__label" id="tg-skills-label">Sipho's skills</span>
    <div class="pp-tag-group" role="list" aria-labelledby="tg-skills-label">
      <span class="pp-tag" role="listitem"><span class="pp-tag__text">Payroll</span><button class="pp-tag__remove" type="button" aria-label="Remove Payroll"><i data-lucide="x"></i></button></span>
      <span class="pp-tag" role="listitem"><span class="pp-tag__text">SARS eFiling</span><button class="pp-tag__remove" type="button" aria-label="Remove SARS eFiling"><i data-lucide="x"></i></button></span>
      <span class="pp-tag" role="listitem"><span class="pp-tag__text">Sage 300</span><button class="pp-tag__remove" type="button" aria-label="Remove Sage 300"><i data-lucide="x"></i></button></span>
      <span class="pp-tag" role="listitem"><span class="pp-tag__text">isiZulu</span><button class="pp-tag__remove" type="button" aria-label="Remove isiZulu"><i data-lucide="x"></i></button></span>
    </div>
    <div><button class="pp-button pp-button--subtle pp-button--small" type="button"><i data-lucide="plus"></i><span>Add skill</span></button></div>
  </div>
</section>
