<section data-example="Text lines">
  <div class="pp-skeleton-group" role="status" aria-busy="true">
    <span class="pp-skeleton-group__label">Loading the job description</span>
    <span class="pp-skeleton pp-skeleton--heading"></span>
    <span class="pp-skeleton pp-skeleton--text"></span>
    <span class="pp-skeleton pp-skeleton--text"></span>
    <span class="pp-skeleton pp-skeleton--text pp-skeleton--text-short"></span>
  </div>
</section>
<section data-example="People list rows">
  <div class="pp-skeleton-group" role="status" aria-busy="true" style="gap:var(--space-200)">
    <span class="pp-skeleton-group__label">Loading people</span>
    <div class="pp-skeleton-row">
      <span class="pp-skeleton pp-skeleton--avatar"></span>
      <div class="pp-skeleton-stack"><span class="pp-skeleton pp-skeleton--text" style="width:40%"></span><span class="pp-skeleton pp-skeleton--text" style="width:25%"></span></div>
      <span class="pp-skeleton pp-skeleton--lozenge"></span>
    </div>
    <div class="pp-skeleton-row">
      <span class="pp-skeleton pp-skeleton--avatar"></span>
      <div class="pp-skeleton-stack"><span class="pp-skeleton pp-skeleton--text" style="width:50%"></span><span class="pp-skeleton pp-skeleton--text" style="width:30%"></span></div>
      <span class="pp-skeleton pp-skeleton--lozenge"></span>
    </div>
    <div class="pp-skeleton-row">
      <span class="pp-skeleton pp-skeleton--avatar"></span>
      <div class="pp-skeleton-stack"><span class="pp-skeleton pp-skeleton--text" style="width:35%"></span><span class="pp-skeleton pp-skeleton--text" style="width:20%"></span></div>
      <span class="pp-skeleton pp-skeleton--lozenge"></span>
    </div>
  </div>
</section>
<section data-example="Cards and a form">
  <div class="pp-skeleton-group" role="status" aria-busy="true" style="display:grid;gap:var(--space-200);grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))">
    <span class="pp-skeleton-group__label">Loading onboarding summary</span>
    <span class="pp-skeleton pp-skeleton--card"></span>
    <span class="pp-skeleton pp-skeleton--card"></span>
  </div>
  <div class="pp-skeleton-group" role="status" aria-busy="true" style="margin-top:var(--space-300);gap:var(--space-200)">
    <span class="pp-skeleton-group__label">Loading the registration form</span>
    <div class="pp-skeleton-stack"><span class="pp-skeleton pp-skeleton--text" style="width:20%"></span><span class="pp-skeleton pp-skeleton--field"></span></div>
    <div class="pp-skeleton-stack"><span class="pp-skeleton pp-skeleton--text" style="width:25%"></span><span class="pp-skeleton pp-skeleton--field"></span></div>
    <span class="pp-skeleton pp-skeleton--button"></span>
  </div>
</section>
