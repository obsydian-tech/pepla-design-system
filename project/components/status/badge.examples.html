<section data-example="Appearances">
  <div class="pp-inline pp-gap-200">
    <span class="pp-badge">4</span>
    <span class="pp-badge pp-badge--primary">12</span>
    <span class="pp-badge pp-badge--danger">3</span>
    <span class="pp-badge pp-badge--agent">5</span>
    <span class="pp-badge pp-badge--subtle">28</span>
    <span class="pp-badge pp-badge--primary">99+</span>
  </div>
</section>
<section data-example="Beside a label">
  <div class="pp-stack pp-gap-100 pp-measure-narrow">
    <div class="pp-inline pp-inline--between"><span class="pp-text">Approvals</span><span class="pp-badge pp-badge--agent">5<span class="pp-badge__label"> proposals from Batsi waiting for you</span></span></div>
    <div class="pp-inline pp-inline--between"><span class="pp-text">Overdue documents</span><span class="pp-badge pp-badge--danger">3<span class="pp-badge__label"> overdue</span></span></div>
    <div class="pp-inline pp-inline--between"><span class="pp-text">Candidates</span><span class="pp-badge">28</span></div>
  </div>
</section>
<section data-example="On an icon button">
  <div class="pp-inline pp-gap-300">
    <span class="pp-badge-anchor">
      <button class="pp-button pp-button--subtle pp-button--icon" type="button" aria-label="Help desk, 2 new questions"><i data-lucide="life-buoy"></i></button>
      <span class="pp-badge pp-badge--primary" aria-hidden="true">2</span>
    </span>
    <span class="pp-badge-anchor">
      <button class="pp-button pp-button--subtle pp-button--icon" type="button" aria-label="Batsi's proposals, new since you last looked"><i data-lucide="sparkles"></i></button>
      <span class="pp-badge pp-badge--agent pp-badge--dot" aria-hidden="true"></span>
    </span>
  </div>
</section>
