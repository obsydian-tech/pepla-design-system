<section data-example="Appearances">
  <div style="display:flex;flex-wrap:wrap;gap:var(--space-200);align-items:center">
    <span class="pp-badge">4</span>
    <span class="pp-badge pp-badge--primary">12</span>
    <span class="pp-badge pp-badge--danger">3</span>
    <span class="pp-badge pp-badge--agent">5</span>
    <span class="pp-badge pp-badge--subtle">28</span>
    <span class="pp-badge pp-badge--primary">99+</span>
  </div>
</section>
<section data-example="Beside a label">
  <div style="display:flex;flex-direction:column;gap:var(--space-100);max-width:280px">
    <a href="./" style="display:flex;justify-content:space-between;align-items:center;min-height:var(--size-control-medium);color:var(--color-text);text-decoration:none"><span>Approvals</span><span class="pp-badge pp-badge--agent">5<span class="pp-badge__label"> proposals from Pepla waiting for you</span></span></a>
    <a href="./" style="display:flex;justify-content:space-between;align-items:center;min-height:var(--size-control-medium);color:var(--color-text);text-decoration:none"><span>Overdue documents</span><span class="pp-badge pp-badge--danger">3<span class="pp-badge__label"> overdue</span></span></a>
    <a href="./" style="display:flex;justify-content:space-between;align-items:center;min-height:var(--size-control-medium);color:var(--color-text);text-decoration:none"><span>Candidates</span><span class="pp-badge">28</span></a>
  </div>
</section>
<section data-example="On an icon button">
  <div style="display:flex;gap:var(--space-300);align-items:center">
    <span class="pp-badge-anchor">
      <button class="pp-button pp-button--subtle pp-button--icon" type="button" aria-label="Help desk, 2 new questions"><i data-lucide="life-buoy"></i></button>
      <span class="pp-badge pp-badge--primary" aria-hidden="true">2</span>
    </span>
    <span class="pp-badge-anchor">
      <button class="pp-button pp-button--subtle pp-button--icon" type="button" aria-label="Pepla's proposals, new since you last looked"><i data-lucide="sparkles"></i></button>
      <span class="pp-badge pp-badge--agent pp-badge--dot" aria-hidden="true"></span>
    </span>
  </div>
</section>
