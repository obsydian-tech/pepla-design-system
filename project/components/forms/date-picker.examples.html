<section data-example="Field">
  <div class="pp-form">
    <div class="pp-form-row">
      <div class="pp-field">
        <label class="pp-field__label" for="dp-start">Start date<span class="pp-field__required" aria-hidden="true">*</span></label>
        <div class="pp-date-picker">
          <div class="pp-text-field">
            <input class="pp-text-field__input" id="dp-start" type="text" value="23 Nov 2026" required autocomplete="off" aria-describedby="dp-start-help">
            <button class="pp-text-field__action" type="button" aria-label="Choose start date" aria-haspopup="dialog" aria-expanded="false"><i data-lucide="calendar-days"></i></button>
          </div>
        </div>
        <div class="pp-field__help" id="dp-start-help">Monday, in 12 days</div>
      </div>
      <div class="pp-field">
        <label class="pp-field__label" for="dp-dob">Date of birth</label>
        <div class="pp-date-picker">
          <div class="pp-text-field">
            <input class="pp-text-field__input" id="dp-dob" type="text" value="14 Mar 1992" readonly aria-describedby="dp-dob-help">
          </div>
        </div>
        <div class="pp-field__help" id="dp-dob-help">Read from the ID number</div>
      </div>
    </div>
  </div>
</section>

<section data-example="Error">
  <div class="pp-field pp-measure-narrow">
    <label class="pp-field__label" for="dp-end">Contract end date<span class="pp-field__required" aria-hidden="true">*</span></label>
    <div class="pp-date-picker">
      <div class="pp-text-field">
        <input class="pp-text-field__input" id="dp-end" type="text" value="31 Nov 2026" required aria-invalid="true" aria-describedby="dp-end-error">
        <button class="pp-text-field__action" type="button" aria-label="Choose contract end date" aria-haspopup="dialog" aria-expanded="false"><i data-lucide="calendar-days"></i></button>
      </div>
    </div>
    <div class="pp-field__error" id="dp-end-error"><i data-lucide="octagon-alert"></i><span>November has 30 days. Check the date, for example 30 Nov 2026.</span></div>
  </div>
</section>
