<section data-example="Settings list">
  <div class="pp-stack pp-measure-form">
    <div class="pp-toggle pp-toggle--end">
      <input class="pp-toggle__input" type="checkbox" role="switch" id="tg-remind" checked aria-describedby="tg-remind-d">
      <label class="pp-toggle__label" for="tg-remind">Remind new employees about missing documents<span class="pp-toggle__description" id="tg-remind-d">Batsi sends a WhatsApp message 2 days before the deadline</span></label>
    </div>
    <div class="pp-toggle pp-toggle--end">
      <input class="pp-toggle__input" type="checkbox" role="switch" id="tg-digest">
      <label class="pp-toggle__label" for="tg-digest">Weekly summary email to managers</label>
    </div>
    <div class="pp-toggle pp-toggle--end">
      <input class="pp-toggle__input" type="checkbox" role="switch" id="tg-payroll" disabled aria-describedby="tg-payroll-d">
      <label class="pp-toggle__label" for="tg-payroll">Send new employees to payroll automatically<span class="pp-toggle__description" id="tg-payroll-d">Connect your payroll first in Settings</span></label>
    </div>
  </div>
</section>
<section data-example="Switch first, and saving">
  <div class="pp-stack">
    <div class="pp-toggle">
      <input class="pp-toggle__input" type="checkbox" role="switch" id="tg-visible" checked>
      <label class="pp-toggle__label" for="tg-visible">Show Thandeka's birthday to the team</label>
    </div>
    <div class="pp-toggle">
      <input class="pp-toggle__input" type="checkbox" role="switch" id="tg-saving" checked aria-busy="true" aria-describedby="tg-saving-d">
      <label class="pp-toggle__label" for="tg-saving">Allow half-day leave<span class="pp-toggle__description" id="tg-saving-d" role="status">Saving</span></label>
    </div>
  </div>
</section>
