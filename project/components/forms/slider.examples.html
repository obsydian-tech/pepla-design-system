<section data-example="Score with words">
  <div class="pp-form">
    <div class="pp-field pp-slider">
      <div class="pp-slider__header">
        <label class="pp-field__label" for="sl-tech">Technical skills</label>
        <output class="pp-slider__value" for="sl-tech" id="sl-tech-out">7 out of 10, strong</output>
      </div>
      <input class="pp-slider__input" id="sl-tech" type="range" min="1" max="10" step="1" value="7" aria-valuetext="7 out of 10, strong" aria-describedby="sl-tech-help" style="--_pct:66.67%">
      <div class="pp-slider__scale" aria-hidden="true"><span>1 Weak</span><span>10 Excellent</span></div>
      <div class="pp-field__help" id="sl-tech-help">How well Lerato did on the take-home task</div>
    </div>
    <div class="pp-field pp-slider">
      <div class="pp-slider__header">
        <label class="pp-field__label" for="sl-comm">Communication</label>
        <output class="pp-slider__value" for="sl-comm">4 out of 10, fair</output>
      </div>
      <input class="pp-slider__input" id="sl-comm" type="range" min="1" max="10" step="1" value="4" aria-valuetext="4 out of 10, fair" style="--_pct:33.33%">
      <div class="pp-slider__scale" aria-hidden="true"><span>1 Weak</span><span>10 Excellent</span></div>
    </div>
  </div>
</section>
<section data-example="Weight in percent">
  <div class="pp-form">
    <div class="pp-field pp-slider">
      <div class="pp-slider__header">
        <label class="pp-field__label" for="sl-weight">Weight of the interview score</label>
        <output class="pp-slider__value" for="sl-weight">40%</output>
      </div>
      <input class="pp-slider__input" id="sl-weight" type="range" min="0" max="100" step="5" value="40" aria-valuetext="40 percent" aria-describedby="sl-weight-help" style="--_pct:40%">
      <div class="pp-slider__scale" aria-hidden="true"><span>0%</span><span>100%</span></div>
      <div class="pp-field__help" id="sl-weight-help">The four weights add up to 100%. 20% is left to share.</div>
    </div>
  </div>
</section>
<section data-example="Disabled">
  <div class="pp-form">
    <div class="pp-field pp-slider">
      <div class="pp-slider__header">
        <label class="pp-field__label" for="sl-dis">Cultural fit</label>
        <output class="pp-slider__value" for="sl-dis">6 out of 10, good</output>
      </div>
      <input class="pp-slider__input" id="sl-dis" type="range" min="1" max="10" step="1" value="6" disabled aria-valuetext="6 out of 10, good" aria-describedby="sl-dis-help" style="--_pct:55.56%">
      <div class="pp-field__help" id="sl-dis-help">Scores lock once Sipho Ndlovu sends his review</div>
    </div>
  </div>
</section>
