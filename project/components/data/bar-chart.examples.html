<section data-example="People by step">
  <figure class="pp-bar-chart">
    <figcaption class="pp-bar-chart__title">People by step</figcaption>
    <div class="pp-bar-chart__bars" aria-hidden="true">
        <div class="pp-bar-chart__row"><span class="pp-bar-chart__label">Invited</span><span class="pp-bar-chart__track"><span class="pp-bar-chart__bar" style="--_share: 100%"></span></span><span class="pp-bar-chart__value">4</span></div>
        <div class="pp-bar-chart__row"><span class="pp-bar-chart__label">Documents</span><span class="pp-bar-chart__track"><span class="pp-bar-chart__bar" style="--_share: 75%"></span></span><span class="pp-bar-chart__value">3</span></div>
        <div class="pp-bar-chart__row"><span class="pp-bar-chart__label">In review</span><span class="pp-bar-chart__track"><span class="pp-bar-chart__bar" style="--_share: 50%"></span></span><span class="pp-bar-chart__value">2</span></div>
        <div class="pp-bar-chart__row"><span class="pp-bar-chart__label">Verified</span><span class="pp-bar-chart__track"><span class="pp-bar-chart__bar" style="--_share: 25%"></span></span><span class="pp-bar-chart__value">1</span></div>
    </div>
    <table class="pp-visually-hidden"><caption>People by step</caption><tbody>
          <tr><th scope="row">Invited</th><td>4</td></tr>
          <tr><th scope="row">Documents</th><td>3</td></tr>
          <tr><th scope="row">In review</th><td>2</td></tr>
          <tr><th scope="row">Verified</th><td>1</td></tr>
    </tbody></table>
  </figure>
</section>
