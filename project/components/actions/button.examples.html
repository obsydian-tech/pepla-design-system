<section data-example="Appearances">
  <div class="pp-button-group">
    <button class="pp-button pp-button--primary" type="button">Send contract</button>
    <button class="pp-button pp-button--default" type="button">Edit</button>
    <button class="pp-button pp-button--subtle" type="button">Skip for now</button>
    <button class="pp-button" type="button">More options</button>
    <button class="pp-button pp-button--danger" type="button">Withdraw offer</button>
    <button class="pp-button pp-button--link" type="button">View history</button>
  </div>
</section>
<section data-example="With icons and sizes">
  <div class="pp-button-group">
    <button class="pp-button pp-button--primary pp-button--large" type="button"><i data-lucide="user-plus"></i><span>Add new employee</span></button>
    <button class="pp-button pp-button--default" type="button"><i data-lucide="upload"></i><span>Upload document</span></button>
    <button class="pp-button pp-button--default pp-button--small" type="button">Review</button>
    <button class="pp-button pp-button--subtle pp-button--icon" type="button" aria-label="More actions for Thandeka Dlamini" aria-haspopup="menu" aria-expanded="false"><i data-lucide="ellipsis"></i></button>
  </div>
</section>
<section data-example="States">
  <div class="pp-button-group">
    <button class="pp-button pp-button--primary" type="button" aria-busy="true"><span>Sending</span><span class="pp-spinner pp-spinner--inverse" aria-hidden="true"></span></button>
    <button class="pp-button pp-button--default" type="button" aria-pressed="true">Filtered: overdue</button>
    <button class="pp-button pp-button--primary" type="button" disabled>Send contract</button>
  </div>
</section>
<section data-example="Agent approval (inside an agent proposal only)">
  <div class="pp-button-group">
    <button class="pp-button pp-button--agent" type="button"><i data-lucide="check"></i><span>Approve</span></button>
    <button class="pp-button pp-button--default" type="button">Edit</button>
    <button class="pp-button pp-button--subtle" type="button">Decline</button>
  </div>
</section>
<section data-example="Dialog footer, stacks on phone">
  <div class="pp-button-group pp-button-group--end pp-button-group--stack-phone">
    <button class="pp-button pp-button--default" type="button">Keep offer</button>
    <button class="pp-button pp-button--danger" type="button">Withdraw offer</button>
  </div>
</section>
