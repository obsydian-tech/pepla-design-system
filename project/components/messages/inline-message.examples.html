<section data-example="Under a field">
  <div class="pp-field pp-measure-narrow">
    <label class="pp-field__label" for="im-id">South African ID number</label>
    <input class="pp-text-field" id="im-id" type="text" inputmode="numeric" value="900514512408" aria-invalid="true" aria-describedby="im-id-msg">
    <div class="pp-field__error" id="im-id-msg"><i data-lucide="octagon-alert"></i><span>That ID number has 12 digits. South African IDs have 13.</span></div>
  </div>
</section>
<section data-example="Appearances">
  <div class="pp-stack pp-gap-150">
    <p class="pp-inline-message"><i data-lucide="info"></i><span>Only Thandeka and payroll admins can see salaries.</span></p>
    <p class="pp-inline-message pp-inline-message--success"><i data-lucide="circle-check"></i><span>Bank details verified on 4 Nov 2026</span></p>
    <p class="pp-inline-message pp-inline-message--warning"><i data-lucide="clock"></i><span>Due in 2 days</span></p>
    <p class="pp-inline-message pp-inline-message--error"><i data-lucide="clock-alert"></i><span>Overdue by 1 day</span></p>
    <p class="pp-inline-message pp-inline-message--agent"><i data-lucide="sparkles"></i><span>Pepla filled this from Sipho's CV. Check it before you save.</span></p>
  </div>
</section>
<section data-example="Beside a row">
  <div class="pp-card pp-card--compact">
    <div class="pp-inline pp-inline--between pp-gap-200">
      <span class="pp-text pp-text--strong">Work permit</span>
      <span class="pp-inline-message pp-inline-message--warning pp-inline-message--inline"><i data-lucide="triangle-alert"></i><span>Expires in 12 days</span></span>
    </div>
  </div>
</section>
