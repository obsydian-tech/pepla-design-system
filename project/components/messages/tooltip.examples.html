<section data-example="Tooltip">
  <div class="pp-inline pp-gap-200">
    <span class="pp-tooltip pp-tooltip--inline" role="tooltip">View audit trail</span>
    <span class="pp-tooltip pp-tooltip--inline" role="tooltip">Search people<kbd>/</kbd></span>
    <span class="pp-tooltip pp-tooltip--inline" role="tooltip">Thandeka Dlamini, Finance manager, Johannesburg</span>
  </div>
</section>
<section data-example="On icon buttons (hover or tab to them)">
  <div class="pp-inline pp-gap-100">
    <span class="pp-tooltip-anchor">
      <button class="pp-button pp-button--subtle pp-button--icon" type="button" aria-label="Audit trail" aria-describedby="tt-1"><i data-lucide="history"></i></button>
      <span class="pp-tooltip" role="tooltip" id="tt-1">View audit trail</span>
    </span>
    <span class="pp-tooltip-anchor">
      <button class="pp-button pp-button--subtle pp-button--icon" type="button" aria-label="Show ID number" aria-describedby="tt-2"><i data-lucide="eye"></i></button>
      <span class="pp-tooltip" role="tooltip" id="tt-2">Showing the ID is logged</span>
    </span>
    <span class="pp-tooltip-anchor">
      <button class="pp-button pp-button--subtle pp-button--icon" type="button" aria-label="More actions for Sipho Ndlovu" aria-haspopup="menu" aria-expanded="false"><i data-lucide="ellipsis"></i></button>
      <span class="pp-tooltip pp-tooltip--end" role="tooltip" aria-hidden="true">More actions</span>
    </span>
  </div>
</section>
<section data-example="Placement">
  <div class="pp-inline pp-inline--top pp-gap-600">
    <span class="pp-tooltip-anchor pp-tooltip-anchor--open"><button class="pp-button pp-button--default pp-button--small" type="button">Top</button><span class="pp-tooltip" role="tooltip">Above by default</span></span>
    <span class="pp-tooltip-anchor pp-tooltip-anchor--open"><button class="pp-button pp-button--default pp-button--small" type="button">Bottom</button><span class="pp-tooltip pp-tooltip--bottom" role="tooltip">Below near the top edge</span></span>
  </div>
</section>
