<section data-example="Sign in">
  <div class="pp-sign-in">
    <div class="pp-sign-in__panel">
      <span class="pp-logo"><i data-pepla-mark></i><span class="pp-logo__word"><span class="pp-logo__name">Naleko <span class="pp-logo__people">People</span></span><span class="pp-logo__maker">by Naleko</span></span></span>
      <div class="pp-sign-in__card">
        <div class="pp-sign-in__heading"><h1 class="pp-sign-in__title">Sign in</h1><span class="pp-sign-in__company">Mokoena Logistics</span></div>
        <form class="pp-form" aria-label="Sign in">
          <div class="pp-field"><label class="pp-field__label" for="si-ex-email">Email</label><input class="pp-text-field" id="si-ex-email" type="email" value="thandeka.dlamini@mokoena-logistics.co.za" autocomplete="email"></div>
          <div class="pp-field"><label class="pp-field__label" for="si-ex-pw">Password</label><div class="pp-text-field pp-password"><input class="pp-text-field__input" id="si-ex-pw" type="password" value="winter-protea-2026" autocomplete="current-password"><button class="pp-text-field__action" type="button" aria-pressed="false" aria-controls="si-ex-pw" aria-label="Show password"><i data-lucide="eye"></i></button></div></div>
          <div class="pp-sign-in__actions"><button class="pp-button pp-button--primary" type="submit"><span>Sign in</span></button></div>
        </form>
      </div>
      <p class="pp-sign-in__footer">Forgot your password? Your Admin can send you a new link.</p>
    </div>
  </div>
</section>
<section data-example="Link expired">
  <div class="pp-sign-in pp-sign-in--phone">
    <div class="pp-sign-in__panel">
      <span class="pp-logo"><i data-pepla-mark></i><span class="pp-logo__word"><span class="pp-logo__name">Naleko <span class="pp-logo__people">People</span></span><span class="pp-logo__maker">by Naleko</span></span></span>
      <div class="pp-sign-in__card">
        <div class="pp-sign-in__heading"><h1 class="pp-sign-in__title">This link has expired</h1><p class="pp-sign-in__lead">Links work once and for 7 days. Ask Thandeka Dlamini at Mokoena Logistics for a new one.</p></div>
        <div class="pp-sign-in__actions"><button class="pp-button pp-button--primary" type="button"><i data-lucide="mail"></i><span>Ask for a new link</span></button></div>
      </div>
    </div>
  </div>
</section>
