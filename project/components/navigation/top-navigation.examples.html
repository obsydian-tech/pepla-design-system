<section data-example="Notifications open">
  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:var(--space-050)">
    <header class="pp-top-navigation pp-top-navigation--inline" style="width:100%;box-sizing:border-box">
      <label class="pp-top-navigation__search"><i data-lucide="search"></i><input type="search" placeholder="Search people and documents" aria-label="Search people and documents"></label>
      <div class="pp-top-navigation__actions">
        <button class="pp-button pp-button--subtle pp-button--icon" type="button" aria-label="Notifications, 3 unread" aria-haspopup="dialog" aria-expanded="true" aria-controls="tn-n" aria-pressed="true"><i data-lucide="bell"></i><span class="pp-top-navigation__badge" aria-hidden="true">3</span></button>
        <button class="pp-top-navigation__avatar" type="button" aria-label="Your account, Thandeka Dlamini"><span aria-hidden="true">TD</span></button>
      </div>
    </header>
    <div class="pp-popup pp-popup--inline pp-popup--flush pp-popup--wide" id="tn-n" role="dialog" aria-labelledby="tn-n-t">
      <div class="pp-popup__header"><h3 class="pp-popup__title" id="tn-n-t">Notifications</h3><button class="pp-button pp-button--link pp-button--small" type="button">Mark all as read</button></div>
      <ul style="list-style:none;margin:0;padding:var(--space-050) 0">
        <li style="display:flex;gap:var(--space-150);padding:var(--space-150) var(--space-200)"><i data-lucide="sparkles" style="width:var(--size-icon-medium);height:var(--size-icon-medium);flex:none;color:var(--color-icon-agent)"></i><span><strong>Pepla drafted 3 offer letters</strong><br><span style="color:var(--color-text-subtle);font:var(--font-body-small)">Waiting for your approval. 10 min ago</span></span></li>
        <li style="display:flex;gap:var(--space-150);padding:var(--space-150) var(--space-200)"><i data-lucide="file-text" style="width:var(--size-icon-medium);height:var(--size-icon-medium);flex:none;color:var(--color-icon-subtle)"></i><span><strong>Lerato Mokoena signed her contract</strong><br><span style="color:var(--color-text-subtle);font:var(--font-body-small)">Today, 09:12</span></span></li>
        <li style="display:flex;gap:var(--space-150);padding:var(--space-150) var(--space-200)"><i data-lucide="clock-alert" style="width:var(--size-icon-medium);height:var(--size-icon-medium);flex:none;color:var(--color-icon-danger)"></i><span><strong>Sipho's tax form is overdue by 1 day</strong><br><span style="color:var(--color-text-subtle);font:var(--font-body-small)">Yesterday, 17:00</span></span></li>
      </ul>
      <div class="pp-popup__footer" style="justify-content:center"><a class="pp-button pp-button--link pp-button--small" href="#">See all notifications</a></div>
    </div>
  </div>
</section>
